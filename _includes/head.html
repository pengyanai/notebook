<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}

  {%- comment -%} DNS prefetch + preconnect to CDN {%- endcomment -%}
  <link rel="dns-prefetch" href="https://fastly.jsdelivr.net">
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://github.com" crossorigin>
  <link rel="preconnect" href="https://user-images.githubusercontent.com" crossorigin>

  {%- comment -%} CSS — render-blocking, preload {%- endcomment -%}
  <link rel="preload" href="{{ "/assets/css/style.css" | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">

  {%- comment -%} Search index — preload during idle for instant search {%- endcomment -%}
  <link rel="preload" href="{{ "/search.json" | relative_url }}" as="fetch" crossorigin>

  {%- comment -%} MathJax — preload script (not executed until <script> tag) {%- endcomment -%}
  <link rel="preload" href="{{ site.cdn.mathjax }}" as="script">

  {%- comment -%} MathJax CHTML — preload primary font to avoid FOUT on math pages {%- endcomment -%}
  <link rel="preload" href="{{ site.cdn.mathjax_fonts }}/TeXMath-Regular.woff" as="font" type="font/woff" crossorigin>

  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
