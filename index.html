---
layout: default
---
<ul class="post-list">
{% for post in site.posts %}
  <li>
    <span class="post-list-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a class="post-list-link" href="{{ post.url | relative_url }}"><span class="post-list-title">{{ post.title | escape }}</span></a>
  </li>
{% endfor %}
</ul>
