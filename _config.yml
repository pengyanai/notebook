# Jekyll configuration — optimized for performance + live reload
title: "Joseph's Notebook"
description: "Joseph's Blog"
url: "https://pengyanai.github.io"
baseurl: "/"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Performance: incremental rebuild (only changed files)
incremental: true

# Kramdown settings for math formula support
kramdown:
  math_engine: mathjax
  math_engine_opts:
    preview: true
    preview_as_code: false
  parse_block_html: true
  parse_span_html: true

# SASS: compress output for smaller CSS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - run.py
  - scripts
  - .github
  - vendor
  - .claude
  - v2erminal
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  - intro.md
  - usage.md

# Custom settings
show_excerpts: false
