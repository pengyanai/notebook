# ============================================================
# Joseph's Notebook — Jekyll Configuration
# ============================================================
# Single source of truth. Templates reference site.xxx variables.
# Local override: _config.local.yml (gitignored, for dev overrides)
# ============================================================

# --- Site metadata ---
title: "Joseph's Notebook"
description: "Personal technical blog — LLM training, systems engineering, tooling"
url: "https://pengyanai.github.io"
baseurl: "/"
lang: "en"
author: "Joseph"

# --- URL structure ---
permalink: /:year/:month/:day/:slug:output_ext

# --- Build ---
markdown: kramdown
highlighter: rouge
theme: minima
incremental: false  # Do NOT enable — prevents detection of new files in _posts/
encoding: utf-8

# --- Kramdown ---
# No math_engine — let MathJax process $$...$$ directly in the browser
# kramdown's "mathjax" engine converts $$ to \[ which breaks MathJax 3 rendering
kramdown:
  parse_block_html: true
  parse_span_html: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# --- SASS ---
sass:
  style: compressed

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Defaults (applied to all posts automatically) ---
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Joseph"
      show_reading_progress: true

# --- Exclude from build ---
exclude:
  - run.py
  - scripts
  - .github
  - vendor
  - .claude
  - v2erminal
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md

# --- Include (force processing) ---
include:
  - _headers

# --- Feed ---
feed:
  path: feed.xml
  limit: 20

# --- SEO ---
social:
  name: Joseph
  links:
    - https://github.com/pengyanai

# --- Feature flags & CDN (referenced by templates as site.cdn.xxx) ---
cdn:
  mathjax: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"
  mathjax_fonts: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/output/chtml/fonts/woff-v2"
  mermaid: "https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js"
  fusejs: "https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"

features:
  mathjax: true
  mermaid: true
  search: true
  reading_progress: true
