# Jekyll configuration — optimized for performance + live reload
title: "Joseph's Notebook"
description: "Joseph's Blog"
url: "https://pengyanai.github.io"
baseurl: "/"

# URL structure — clean date-based paths, no categories
permalink: /:year/:month/:day/:slug:output_ext

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Performance: full rebuild on change (~1.5s for 88 posts)
# Do NOT enable incremental: true — it prevents detection of new files in _posts/
# Use: bundle exec jekyll serve --watch --force_polling
incremental: false

# Kramdown settings for math formula support
kramdown:
  math_engine: mathjax
  math_engine_opts:
    preview: true
    preview_as_code: false
  parse_block_html: true
  parse_span_html: true

# SASS: compress output for smaller CSS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - run.py
  - scripts
  - .github
  - vendor
  - .claude
  - v2erminal
  - Gemfile
  - Gemfile.lock
  - README.md
  - intro.md
  - usage.md

# Custom settings
show_excerpts: false
